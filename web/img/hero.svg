<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" fill="none">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff1f2"/>
      <stop offset=".35" stop-color="#ffb3bd"/>
      <stop offset=".7" stop-color="#be123c"/>
      <stop offset="1" stop-color="#be123c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e11d48" stop-opacity=".55"/>
      <stop offset="1" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#ff6b81"/>
      <stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26347a"/>
      <stop offset="1" stop-color="#172150"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>
  <style>
    .spin { transform-origin: 280px 240px; animation: spin 40s linear infinite; }
    .spin-rev { transform-origin: 280px 240px; animation: spin 28s linear infinite reverse; }
    .pulse { transform-origin: 280px 240px; animation: pulse 3.6s ease-in-out infinite; }
    .beam { stroke-dasharray: 14 10; animation: flow 1.1s linear infinite; }
    .spark { animation: spark 1.8s ease-in-out infinite; }
    .s2 { animation-delay: .6s; } .s3 { animation-delay: 1.2s; }
    .node { animation: blink 4s ease-in-out infinite; }
    .n2 { animation-delay: 1s; } .n3 { animation-delay: 2s; } .n4 { animation-delay: 3s; }
    .float { animation: float 6s ease-in-out infinite; }
    .f2 { animation-delay: 2s; } .f3 { animation-delay: 4s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.08); opacity: 1; } }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    @keyframes spark { 0%,100% { opacity: .2; } 50% { opacity: 1; } }
    @keyframes blink { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  </style>

  <!-- background halo -->
  <circle cx="280" cy="240" r="210" fill="url(#halo)"/>

  <!-- orbit rings -->
  <g class="spin" opacity=".75">
    <circle cx="280" cy="240" r="190" stroke="url(#ring)" stroke-width="1.2" stroke-dasharray="2 9"/>
    <circle cx="470" cy="240" r="5" fill="#22d3ee" filter="url(#glow)"/>
    <circle cx="90" cy="240" r="3.5" fill="#ff7a59"/>
  </g>
  <g class="spin-rev" opacity=".6">
    <ellipse cx="280" cy="240" rx="160" ry="160" stroke="#ff6b81" stroke-opacity=".35" stroke-width="1"/>
    <circle cx="280" cy="80" r="4" fill="#ff6b81" filter="url(#glow)"/>
  </g>

  <!-- neural network around the core -->
  <g stroke="#ff6b81" stroke-opacity=".35" stroke-width="1">
    <path d="M280 240 L180 150 M280 240 L380 150 M280 240 L170 300 M280 240 L392 312 M280 240 L280 110 M280 240 L285 368"/>
    <path d="M180 150 L280 110 L380 150 M170 300 L285 368 L392 312 M180 150 L170 300 M380 150 L392 312"/>
  </g>
  <g fill="#ffb3bd">
    <circle class="node" cx="180" cy="150" r="5"/>
    <circle class="node n2" cx="380" cy="150" r="5"/>
    <circle class="node n3" cx="170" cy="300" r="5"/>
    <circle class="node n4" cx="392" cy="312" r="5"/>
    <circle class="node n2" cx="280" cy="110" r="4"/>
    <circle class="node n3" cx="285" cy="368" r="4"/>
  </g>

  <!-- shield arc (defence) -->
  <path d="M168 168 A135 135 0 0 1 392 168" stroke="url(#shield)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M150 262 A135 135 0 0 0 410 262" stroke="#22d3ee" stroke-opacity=".35" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- AI chip core -->
  <g class="pulse">
    <circle cx="280" cy="240" r="78" fill="url(#core)" opacity=".55" filter="url(#soft)"/>
  </g>
  <g>
    <g stroke="#e11d48" stroke-width="3" stroke-linecap="round">
      <path d="M252 188v-12M270 188v-12M290 188v-12M308 188v-12"/>
      <path d="M252 292v12M270 292v12M290 292v12M308 292v12"/>
      <path d="M228 212h-12M228 232h-12M228 250h-12M228 268h-12"/>
      <path d="M332 212h12M332 232h12M332 250h12M332 268h12"/>
    </g>
    <rect x="228" y="188" width="104" height="104" rx="22" fill="url(#chip)" stroke="url(#ring)" stroke-width="2"/>
    <rect x="244" y="204" width="72" height="72" rx="14" fill="#101a3d" stroke="#ff6b81" stroke-opacity=".5"/>
    <!-- tiny brain / neural glyph -->
    <g stroke="#ffe4e6" stroke-width="2.2" stroke-linecap="round" fill="none" filter="url(#glow)">
      <path d="M268 226c-8 0-12 7-10 13-6 3-6 13 1 15 0 7 7 10 12 7"/>
      <path d="M292 226c8 0 12 7 10 13 6 3 6 13-1 15 0 7-7 10-12 7"/>
      <path d="M280 222v40M270 240h8M282 248h8"/>
    </g>
  </g>

  <!-- incoming attack beams (blocked at the shield) -->
  <g stroke-width="3" stroke-linecap="round">
    <path class="beam" d="M40 70 L176 160" stroke="url(#beam)"/>
    <path class="beam" d="M520 60 L386 158" stroke="url(#beam)"/>
    <path class="beam" d="M30 420 L156 300" stroke="#fb7185" stroke-opacity=".7"/>
  </g>
  <g fill="#fda4af" filter="url(#glow)">
    <circle class="spark" cx="178" cy="162" r="6"/>
    <circle class="spark s2" cx="384" cy="160" r="6"/>
    <circle class="spark s3" cx="158" cy="298" r="5"/>
  </g>

  <!-- floating labels -->
  <g class="float" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">
    <rect x="18" y="28" width="148" height="30" rx="15" fill="#1f2a5c" stroke="#fb7185" stroke-opacity=".6"/>
    <circle cx="36" cy="43" r="4" fill="#fb7185"/>
    <text x="48" y="47" fill="#fecdd3">Prompt injection</text>
  </g>
  <g class="float f2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">
    <rect x="404" y="18" width="128" height="30" rx="15" fill="#1f2a5c" stroke="#fb7185" stroke-opacity=".6"/>
    <circle cx="422" cy="33" r="4" fill="#fb7185"/>
    <text x="434" y="37" fill="#fecdd3">Jailbreak</text>
  </g>
  <g class="float f3" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">
    <rect x="10" y="430" width="150" height="30" rx="15" fill="#1f2a5c" stroke="#fb7185" stroke-opacity=".6"/>
    <circle cx="28" cy="445" r="4" fill="#fb7185"/>
    <text x="40" y="449" fill="#fecdd3">Data exfiltration</text>
  </g>
  <g class="float f2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">
    <rect x="388" y="410" width="156" height="34" rx="17" fill="#123a4a" stroke="#22d3ee" stroke-opacity=".7"/>
    <path d="M406 427l5 5 9-10" stroke="#67e8f9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="428" y="431" fill="#a5f3fc">Canary intact</text>
  </g>
</svg>
